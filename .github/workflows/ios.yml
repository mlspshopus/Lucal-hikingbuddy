name: iOS Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -30

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project RidgeLineOverland.xcodeproj \
            -scheme RidgeLineOverland \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
